services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ffsms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${DB_NAME:-ffsms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ffsms} -d ${DB_NAME:-ffsms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein Port nach aussen: die Datenbank wird ausschliesslich vom
    # api-Container im internen Netz erreicht.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ffsms}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ffsms}
      API_KEYS: ${API_KEYS:?API_KEYS muss in .env gesetzt sein}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      ALERT_SEGMENTS_PER_CAMPAIGN: ${ALERT_SEGMENTS_PER_CAMPAIGN:-150}
      ALERT_SEGMENTS_PER_MONTH: ${ALERT_SEGMENTS_PER_MONTH:-1500}
      TZ_REPORT: ${TZ_REPORT:-Europe/Vienna}
      WEEKLY_REPORT_CRON: ${WEEKLY_REPORT_CRON:-0 20 * * 0}
      REPORT_TITLE: ${REPORT_TITLE:-FF-SMS}
      UPDATE_DIR: /data/updates
      DOWNLOAD_PASSWORD: ${DOWNLOAD_PASSWORD:-}
    volumes:
      # Hier liegen app-release.apk und release.json fuer den Update-Kanal.
      # Nur lesend eingebunden: der Dienst soll das APK ausliefern, nicht
      # veraendern koennen.
      - ./updates:/data/updates:ro
    ports:
      # Nur auf localhost. Nach aussen kommt der Dienst ueber Tailscale
      # bzw. den Cloudflare Tunnel, nicht ueber einen offenen Port.
      - "127.0.0.1:3000:3000"

  # ntfy: Push-Meldungen auf das Handy. Laeuft mit deny-all, es kommt also
  # niemand ohne Zugangsdaten an die Meldungen - beim oeffentlichen ntfy.sh
  # waere das anders.
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:?NTFY_BASE_URL muss in .env gesetzt sein}
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    volumes:
      - ntfydata:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel. Startet nur mit "--profile tunnel", damit ein Setup
  # ohne Tunnel (z. B. reiner LAN-Betrieb) nicht daran scheitert.
  #
  # WICHTIG beim Betrieb: wird der api-Container NEU ERZEUGT (nicht nur
  # neu gestartet), bekommt er eine neue IP im Docker-Netz. cloudflared haelt
  # dann offene Verbindungen zur alten Adresse, und Cloudflare antwortet mit
  # 502 - der Tunnel selbst ist dabei voellig in Ordnung. Deshalb nach jedem
  # "docker compose up -d --build" auch
  #     docker compose restart cloudflared
  # ausfuehren. Das erledigt update.sh im selben Verzeichnis.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN muss in .env gesetzt sein}
    depends_on:
      - api
      - ntfy

volumes:
  pgdata:
  ntfydata:
